name: analysis-30y-synthetic-dotcom
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_30y_synthetic_dotcom.py
      - .github/workflows/analysis-30y-synthetic-dotcom.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy openpyxl requests
      - name: Patch long gold source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis_30y_synthetic_dotcom.py')
          s=p.read_text()
          old="rg=requests.get(STOOQ_GOLD,headers={'User-Agent':'Mozilla/5.0'},timeout=45);rg.raise_for_status()\ngold_df=pd.read_csv(io.StringIO(rg.text));gold_df.columns=[c.capitalize() for c in gold_df.columns];gold_df['Date']=pd.to_datetime(gold_df.Date);gold=gold_df.set_index('Date')['Close'].astype(float).sort_index();gold=gold.loc[gold.index>=pd.Timestamp(START)]"
          new="gold=fred('GOLDAMGBD228NLBM');gold=gold.loc[gold.index>=pd.Timestamp(START)]"
          if old not in s:
              raise SystemExit('gold source block not found')
          p.write_text(s.replace(old,new))
          PY
      - run: python analysis_30y_synthetic_dotcom.py > analysis_30y_synthetic_dotcom_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_30y_synthetic_dotcom_result.txt analysis_30y_synthetic_dotcom_summary.csv
          git commit -m 'analysis: save 30y synthetic dotcom validation results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
