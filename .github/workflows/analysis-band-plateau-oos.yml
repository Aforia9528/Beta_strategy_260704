name: analysis-band-plateau-oos
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_band_plateau_oos.py
      - .github/workflows/analysis-band-plateau-oos.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy
      - run: python analysis_band_plateau_oos.py > analysis_band_plateau_oos_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_band_plateau_oos_result.txt
          git commit -m 'analysis: save deep band plateau OOS results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
