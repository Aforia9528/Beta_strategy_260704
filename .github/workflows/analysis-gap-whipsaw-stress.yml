name: analysis-gap-whipsaw-stress
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_gap_whipsaw_stress.py
      - .github/workflows/analysis-gap-whipsaw-stress.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy openpyxl requests
      - run: python analysis_gap_whipsaw_stress.py > analysis_gap_whipsaw_stress_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_gap_whipsaw_stress_result.txt
          git commit -m 'analysis: save gap whipsaw stress results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
