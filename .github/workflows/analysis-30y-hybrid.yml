name: analysis-30y-hybrid
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_30y_hybrid.py
      - analysis_30y_runner.py
      - analysis_30y_synthetic_dotcom.py
      - .github/workflows/analysis-30y-hybrid.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy openpyxl requests
      - run: python analysis_30y_hybrid.py > analysis_30y_hybrid_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_30y_hybrid_result.txt analysis_30y_hybrid_summary.csv analysis_30y_hybrid_base_monthly.csv
          git commit -m 'analysis: save hybrid 30y validation results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
