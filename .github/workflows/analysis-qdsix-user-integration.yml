name: analysis-qdsix-user-integration
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_qdsix_user_integration.py
      - .github/workflows/analysis-qdsix-user-integration.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy
      - run: python analysis_qdsix_user_integration.py > analysis_qdsix_user_integration_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_qdsix_user_integration_result.txt
          git commit -m 'analysis: save QDSIX integration results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
