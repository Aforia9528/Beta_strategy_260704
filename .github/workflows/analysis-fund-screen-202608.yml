name: analysis-fund-screen-202608
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_fund_screen_202608.py
      - .github/workflows/analysis-fund-screen-202608.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy
      - run: python analysis_fund_screen_202608.py > analysis_fund_screen_202608_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_fund_screen_202608_result.txt analysis_fund_screen_202608_result.csv
          git commit -m 'analysis: save systematic fund screen' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
