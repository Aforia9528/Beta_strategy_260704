name: analysis-tail-hedge-partial-robust
on:
  push:
    branches: [analysis-kodex-409820-20260809]
    paths:
      - analysis_tail_hedge_partial_robust.py
      - .github/workflows/analysis-tail-hedge-partial-robust.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-kodex-409820-20260809
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy scipy
      - run: python analysis_tail_hedge_partial_robust.py > analysis_tail_hedge_partial_robust_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_tail_hedge_partial_robust_result.txt
          git commit -m 'analysis: save partial exit robustness results' || exit 0
          git push origin HEAD:analysis-kodex-409820-20260809
